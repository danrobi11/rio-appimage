name: Build Rio (Nix)

on:
  workflow_dispatch:

jobs:
  build-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Rio (skip tests)
        run: |
          set -o pipefail
          nix build \
            --print-out-paths \
            --impure \
            --expr '
              let
                pkgs = import <nixpkgs> {};
                rioFlake = builtins.getFlake "github:raphamorim/rio/main";
                rio = rioFlake.packages.${pkgs.system}.default or rioFlake.packages.${pkgs.system}.rio;
              in
                rio.overrideAttrs (old: {
                  doCheck = false;
                  doInstallCheck = false;
                })
            ' | tee out-path.txt

          echo "Successfully built:"
          cat out-path.txt

      - name: Prepare artifact
        run: |
          set -e
          OUT=$(cat out-path.txt)
          mkdir -p artifact
          cp -a "$OUT/bin/rio" artifact/
          if [ -d "$OUT/share/terminfo" ]; then
            cp -a "$OUT/share/terminfo" artifact/ || true
          fi
          ls -la artifact/
          file artifact/rio

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rio-main-nix-binary
          path: artifact/
          retention-days: 14
