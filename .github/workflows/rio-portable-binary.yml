name: Build Rio (Nix)

on:
  workflow_dispatch:          # manual trigger only

jobs:
  build-nix:
    runs-on: ubuntu-latest
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Rio from upstream flake
        run: |
          nix build github:raphamorim/rio/v0.5.3 --print-out-paths | tee out-path.txt
          echo "Built store path:"
          cat out-path.txt

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          # copy the binary
          cp -a $(cat out-path.txt)/bin/rio artifact/
          # optional: also grab the terminfo if present
          if [ -d $(cat out-path.txt)/share/terminfo ]; then
            cp -a $(cat out-path.txt)/share/terminfo artifact/ || true
          fi
          ls -la artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rio-0.5.3-nix-binary
          path: artifact/
          retention-days: 14
